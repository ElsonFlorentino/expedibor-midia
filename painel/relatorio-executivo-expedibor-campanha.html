<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatório Executivo — Campanha Expedibor</title>
  <style>
    :root {
      --navy-950:#04111f;
      --navy-900:#07182c;
      --navy-800:#0b2a4a;
      --navy-700:#123d66;
      --blue-700:#00539a;
      --blue-600:#0060af;
      --blue-500:#167ac6;
      --blue-300:#75b8e8;
      --blue-100:#dcefff;
      --blue-050:#f0f8ff;
      --ink:#10283d;
      --muted:#60778b;
      --line:#d7e3ed;
      --paper:#ffffff;
      --good:#0a7662;
      --attention:#9b4a3d;
      --shadow:0 20px 60px rgba(4,17,31,.18);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:#e9eff5;color:var(--ink);font-family:Arial,"Helvetica Neue",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .screen-nav{position:fixed;z-index:50;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px;padding:10px;border-radius:20px;background:rgba(4,17,31,.88);backdrop-filter:blur(10px);box-shadow:0 12px 36px rgba(0,0,0,.2)}
    .screen-nav a{width:9px;height:9px;border-radius:50%;background:#7690a7;text-indent:-9999px;overflow:hidden;transition:.2s}
    .screen-nav a:hover{background:#fff;transform:scale(1.35)}
    .report{padding:24px 0 48px}
    .page{position:relative;width:297mm;height:210mm;margin:0 auto 26px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow);padding:12mm 15mm 13mm;page-break-after:always;break-after:page}
    .page:last-child{page-break-after:auto;break-after:auto}
    .page-header{height:10mm;display:flex;align-items:flex-start;border-bottom:1px solid var(--line);gap:12px;margin-bottom:8mm}
    .wordmark{font-size:19px;line-height:1;font-weight:900;font-style:italic;letter-spacing:-1px;color:var(--navy-900)}
    .page-section{font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);padding-top:2px}
    .page-number{margin-left:auto;font-size:11px;font-weight:800;color:var(--blue-600)}
    .page-footer{position:absolute;left:15mm;right:15mm;bottom:6mm;display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:2.5mm;font-size:8px;letter-spacing:.4px;color:#7d90a1}
    h1,h2,h3,p{margin-top:0}
    h2{font-size:29px;line-height:1.02;letter-spacing:-1px;margin-bottom:3mm;color:var(--navy-900)}
    .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:9px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue-600);margin-bottom:3mm}
    .eyebrow:before{content:"";width:18px;height:3px;border-radius:2px;background:var(--blue-600)}
    .lead{font-size:13px;line-height:1.45;color:#49657b;max-width:220mm;margin-bottom:6mm}
    .muted{color:var(--muted)}
    .small{font-size:9px;line-height:1.45;color:var(--muted)}

      <h2>Escalar o que funcionou e corrigir o anúncio de evento</h2>
      <p class="lead">A próxima rodada deve preservar capacidade de aprendizado: ampliar os vencedores sem perder comparabilidade entre variações.</p>
      <div class="action-grid">
        <article class="action-card" data-step="1"><span class="priority">Prioridade alta</span><h3>Escalar Bastidores com controle</h3><p>Aumentar verba em etapas e produzir 2–3 variações do mesmo território: linha de produção, controle de qualidade e pessoas reais. Monitorar custo por visita ao site a cada incremento.</p></article>
        <article class="action-card" data-step="2"><span class="priority">Prioridade alta</span><h3>Manter Oficina como peça de volume</h3><p>Preservar a promessa “não pode parar” e testar produto, oficina e distribuidor como enquadramentos. É a base mais segura para sustentar alcance e visitas.</p></article>
        <article class="action-card" data-step="3"><span class="priority">Prioridade média</span><h3>Reposicionar o criativo MinasParts</h3><p>Trocar o foco exclusivo na data por um benefício de visita: linha completa, condições comerciais ou conversa com especialistas. Deixar data e local como apoio.</p></article>
      </div>
